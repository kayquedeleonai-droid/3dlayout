<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout3D — Previz procedural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0d0d0e; --bg1:#141415; --bg2:#1b1b1d; --bg3:#232326; --bg4:#2d2d31;
  --line:#232326; --line2:#303034;
  --tx:#ececee; --tx2:#a1a1a8; --tx3:#6c6c74;
  --acc:#f2a33a; --acc2:#ffbf5e; --accbg:rgba(242,163,58,.13);
  --sel:#7aa7ff; --selbg:rgba(122,167,255,.14);
  --red:#ef5a50; --grn:#6cc86a; --blu:#4f9cf0; --key:#f2c14e;
  --tl-h:300px; --r:8px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:12.5px/1.4 Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:var(--bg4)}
button.on{background:var(--selbg);border-color:rgba(122,167,255,.55);color:#cfe0ff}
button.pri{background:#f3f3f5;border-color:#f3f3f5;color:#111;font-weight:600}
button.pri:hover{background:#fff}
button.rec{background:#4a1a17;border-color:var(--red);color:#ffd5d2}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--bg3)}
button.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;background:transparent;border-color:transparent;color:var(--tx2);font-size:15px}
button.icon:hover{background:var(--bg3);color:var(--tx)}
button.icon.on{background:var(--bg4);color:var(--tx);border-color:var(--line2)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#55555c}
input[type=color]{padding:0 2px;height:26px;width:42px;cursor:pointer}
input[type=checkbox]{accent-color:#e9e9ec}
input[type=range]{accent-color:#e9e9ec;padding:0;border:0;background:transparent}
.mono{font-family:var(--mono)}
body.cinema #vpwrap{position:fixed;inset:0;z-index:80;background:#000}
body.cinema #rail,body.cinema #vptools,body.cinema #viewBar,body.cinema #lensBar,body.cinema #axesWrap,body.cinema #pip,body.cinema #vpinfo,body.cinema .lbl,body.cinema #labels{display:none!important}
#cineBar{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 18px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:none;z-index:90;font:500 12px Inter,sans-serif;color:#e8eaed}
body.cinema #cineBar{display:block}
#cineBar .row{display:flex;align-items:center;gap:12px}
#cineBar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 12px;font:600 12px Inter;cursor:pointer}
#cineSegs{position:relative;flex:1;height:30px;cursor:pointer;display:flex;gap:2px}
#cineSegs .sg{position:relative;height:100%;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.08);font:600 10.5px Inter;color:rgba(255,255,255,.85);padding:7px 6px 0;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box;min-width:0}
#cineSegs .sg i{position:absolute;left:0;top:0;bottom:0;width:3px}
#cineHead{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 6px #fff}
#app{display:grid;grid-template-rows:50px 1fr 4px var(--tl-h);height:100vh}
/* topo */
#top{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line)}
#top .brand{font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;margin-right:6px}
#top .brand i{width:18px;height:18px;border-radius:5px;background:conic-gradient(from 210deg,#f2a33a,#ef5a50,#7aa7ff,#6cc86a,#f2a33a);display:inline-block}
#top .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
#top .grow{flex:1}
#top .center{display:flex;gap:6px;align-items:center}
#top select{height:32px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;color:var(--tx2)}
.seg button.on{background:var(--bg4);color:var(--tx)}
/* layout */
#main{display:grid;grid-template-columns:276px 1fr 310px;min-height:0}
.panel{background:var(--bg1);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.ph{padding:10px 14px;font-weight:600;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:8px;background:var(--bg1)}
.ph .grow{flex:1}
.ph .sub{font-weight:400;color:var(--tx3);font-size:11px}
/* biblioteca */
#libTabs{display:flex;gap:2px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
#libTabs button{flex:1;height:34px;padding:0;border:0;background:transparent;border-bottom:2px solid transparent;border-radius:0;font-size:15px;color:var(--tx3)}
#libTabs button:hover{color:var(--tx)}
#libTabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
#libSearch{margin:10px 12px 4px;width:calc(100% - 24px)}
#assets{flex:1;overflow:auto;padding:4px 12px 14px}
.acat{margin:12px 2px 7px;color:var(--tx3);font-size:11px;font-weight:500}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:#4a4a50;background:var(--bg2)}
.card:active{transform:scale(.98)}
.card .th{aspect-ratio:4/3;background:radial-gradient(120% 90% at 50% 0%,#2f2f33,#1a1a1c);display:grid;place-items:center;font-size:30px;position:relative}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{padding:7px 9px 1px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sb{padding:0 9px 8px;font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.dis{opacity:.35;pointer-events:none}
.libhint{color:var(--tx3);font-size:11.5px;line-height:1.5;margin:8px 2px;padding:8px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--line)}
/* objetos */
#objPanel{height:40%;min-height:140px;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
#objSearch{margin:0 12px 6px;width:calc(100% - 24px)}
#outliner{flex:1;overflow:auto;padding-bottom:6px}
.ogrp{display:flex;align-items:center;gap:7px;padding:7px 14px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--tx2);cursor:pointer}
.ogrp .n{margin-left:auto;font-weight:500;color:var(--tx3)}
.orow{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 26px;cursor:pointer;border-radius:6px;margin:0 6px}
.orow:hover{background:var(--bg2)}
.orow.sel{background:var(--selbg)}
.orow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .ic{opacity:.45;font-size:12px;cursor:pointer;padding:0 3px}
.orow .ic:hover{opacity:1}
.orow .anim{color:var(--key);font-size:9px}
#propPanel{flex:1;min-height:0;display:flex;flex-direction:column}
#insp{flex:1;overflow:auto}
/* viewport */
#vpwrap{position:relative;min-width:0;min-height:0;background:#0b0b0c;overflow:hidden}
#vp{position:absolute;inset:0}
#vp canvas{display:block}
#overlay2d{position:absolute;inset:0;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-weight:600;font-size:12.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;padding-bottom:6px}
.lbl.cam{font-weight:500;font-size:11px;color:#ffd79a}
.lbl.sel{color:#cfe0ff}
#rail{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:rgba(20,20,22,.92);border:1px solid var(--line2);border-radius:12px;padding:5px;backdrop-filter:blur(8px)}
#rail .sep{height:1px;background:var(--line2);margin:4px 3px}
#rail button{width:34px;height:34px;padding:0;border:0;background:transparent;border-radius:8px;color:var(--tx2);font-size:15px;position:relative}
#rail button:hover{background:var(--bg3);color:var(--tx)}
#rail button.on{background:var(--bg4);color:#fff}
#rail button sub{position:absolute;right:4px;bottom:2px;font-size:8px;color:var(--tx3)}
#vptools{display:none}
#vpinfo{display:none}
#pip{position:absolute;right:12px;top:12px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:transparent;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#pip .pbar{display:flex;align-items:center;gap:6px;padding:6px;background:rgba(20,20,22,.94)}
#pip .pbar select{height:28px;flex:1;min-width:0;font-size:12px;background:var(--bg2)}
#pip .pbody{position:relative}
#pip.min .pbody{display:none}
#viewBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(20,20,22,.94);border:1px solid var(--line2);border-radius:12px;padding:5px 6px;backdrop-filter:blur(8px)}
#viewBar select{height:30px;border:0;background:transparent;font-weight:500;padding-right:4px}
#axesWrap{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#axesBox{width:86px;height:96px;background:rgba(20,20,22,.94);border:1px solid var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#axesC{width:70px;height:70px}
#fovTxt{font-size:10.5px;color:var(--tx2);margin-top:-2px}
#bResetView{background:rgba(20,20,22,.94);border-color:var(--line2);border-radius:10px;font-size:12px}
#lensBar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;background:rgba(20,20,22,.94);border:1px solid var(--line2);border-radius:12px;padding:7px 9px;backdrop-filter:blur(8px);max-width:calc(100% - 140px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lbrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#lensBar select{height:28px;max-width:230px;font-size:12px}
#lensBar input[type=number]{width:52px;height:26px;padding:2px 5px;font-family:var(--mono);margin-left:4px}
.lbt{color:var(--tx2);font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.lbinfo{color:var(--tx3);font-size:11px;margin-left:auto;padding-left:8px;white-space:nowrap}
#lensBar .chip{padding:3px 9px;font-family:var(--mono);font-size:11.5px}
#pilotHud{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);background:rgba(16,16,18,.95);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;display:none;gap:16px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#pilotHud.show{display:flex}
#pilotHud .keys{color:var(--tx2);font-size:11.5px;line-height:1.7}
kbd{font-family:var(--mono);background:var(--bg3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--tx);font-size:10.5px}
#pilotHud .speed{font-family:var(--mono);font-size:24px;color:#fff;min-width:96px;text-align:center}
#pilotHud .speed small{display:block;font-size:10px;color:var(--tx3)}
#recDot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#resizer{background:var(--line);cursor:ns-resize}
#resizer:hover{background:#4a4a50}
/* timeline */
#tl{display:grid;grid-template-rows:42px 1fr;background:var(--bg1);min-height:0}
#tlbar{display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#tlbar .sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
#tlbar input.num{width:58px;text-align:center;font-family:var(--mono)}
#tlbar label{color:var(--tx2);display:flex;align-items:center;gap:6px;white-space:nowrap}
#tlbar button{padding:4px 8px}
#tlbar button.icon{width:30px;height:30px}
#tlbar .grow{flex:1}
#tlMode{height:30px;font-weight:600;background:transparent;border-color:transparent}
#tcode{color:var(--tx2);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.mini{font-size:11px;padding:3px 7px!important;color:var(--tx2)}
#tlbody{display:grid;grid-template-columns:200px 1fr;min-height:0}
#chanList{border-right:1px solid var(--line);overflow:auto;background:var(--bg1);position:relative}
#tlcanvasWrap{position:relative;min-width:0;min-height:0}
#tlcanvas{position:absolute;inset:0;display:block}
.crow{display:flex;align-items:center;gap:7px;padding:0 10px;cursor:pointer;font-size:12px;border-bottom:1px solid #1d1d20}
.crow:hover{background:var(--bg2)}
.crow .cdot{width:8px;height:8px;border-radius:50%}
.crow.off{opacity:.4}
.crow .add{margin-left:auto;width:22px;height:22px;padding:0;border:0;background:transparent;color:var(--tx3);font-size:15px;border-radius:6px}
.crow .add:hover{background:var(--bg4);color:#fff}
.crow.grp{color:var(--tx2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;cursor:default;border:0;padding-top:7px}
.crow.grp:hover{background:none}
#sbHead{position:sticky;bottom:auto;height:46px;flex:none;justify-content:space-between;display:flex;align-items:center;padding:0 10px;gap:8px;background:var(--bg1);border-top:1px solid var(--line2);font-weight:600;font-size:12.5px;z-index:2}
#sbHead button{margin-left:auto;width:26px;height:26px;padding:0;font-size:16px}
/* inspetor */
.sec{border-bottom:1px solid var(--line)}
.sech{display:flex;align-items:center;gap:6px;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--tx)}
.sech .car{color:var(--tx3);font-size:9px;width:10px}
.sech .grow{flex:1}
.secb{padding:2px 14px 12px}
.sec.closed .secb{display:none}
.prow{display:grid;grid-template-columns:18px 70px 1fr 18px;align-items:center;gap:6px;margin:4px 0}
.prow.wide{grid-template-columns:104px 1fr}
.prow .lb{color:var(--tx2);cursor:ew-resize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.wide .lb{cursor:default}
.prow input[type=number],.prow input[type=text],.prow select{width:100%;min-width:0}
.prow input[type=number]{font-family:var(--mono)}
.prow input.animated{color:var(--key);border-color:#6a5420}
.prow input.keyed{background:#2e2610}
.kbtn{width:18px;height:18px;padding:0;display:grid;place-items:center;background:none;border:none;color:var(--tx3);font-size:11px}
.kbtn:hover{color:var(--key);background:none}
.kbtn.has{color:var(--key)}
.sw{width:18px;height:18px;padding:0;border:none;background:none;color:var(--tx3);font-size:12px}
.sw.on{color:var(--key)}
.sw:hover{background:none;color:var(--acc2)}
.grpl{display:flex;align-items:center;gap:4px;margin-top:10px;color:var(--tx2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.grpl .grow{flex:1}
.btnrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.hint{color:var(--tx3);font-size:11.5px;margin:7px 0;line-height:1.5}
.empty{padding:28px 18px;color:var(--tx3);text-align:center;line-height:1.6}
.empty b{color:var(--tx2)}
.tog{position:relative;width:36px;height:20px;border-radius:12px;background:var(--bg4);border:0;padding:0;justify-self:end}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#888;transition:.15s}
.tog.on{background:#e9e9ec}
.tog.on::after{left:19px;background:#111}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#modal.show{display:flex}
#modalBox{background:var(--bg1);border:1px solid var(--line2);border-radius:14px;width:min(700px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#modalBox h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;align-items:center}
#modalBox h3 .grow{flex:1}
#modalBox .mb{padding:16px 18px}
#modalBox textarea{width:100%;min-height:180px;font-family:var(--mono);font-size:11px;resize:vertical}
.mgrid{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center}
.mgrid label{color:var(--tx2)}
.prog{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:#e9e9ec;width:0}
.chip{border-radius:20px;padding:4px 11px;font-size:11.5px;background:var(--bg2)}
.chip.ghosty{background:transparent;border-color:var(--line2);color:var(--tx2);white-space:normal;text-align:left}
.pgrid{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pclb{width:82px;color:var(--tx2);font-size:11.5px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);padding:9px 15px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:80vw}
#toast.show{opacity:1}
.helpgrid{display:grid;grid-template-columns:160px 1fr;gap:5px 12px;font-size:12px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px;border:2px solid var(--bg1)}
::-webkit-scrollbar-track{background:transparent}
#fileIn{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><i></i>Layout3D <span style="color:var(--tx3);font-weight:400">Director</span></div>
    <button class="icon" id="bHelp" title="Atalhos e ajuda">?</button>
    <button class="icon" id="bUndo" title="Desfazer (Ctrl+Z)">↶</button>
    <button class="icon" id="bRedo" title="Refazer (Ctrl+Shift+Z)">↷</button>
    <button class="icon" id="bSave" title="Salvar projeto (Ctrl+S)">💾</button>
    <button class="icon" id="bOpen" title="Abrir projeto">📂</button>
    <div class="sep"></div>
    <button class="ghost" id="bNew" title="Nova cena">Nova cena</button>
    <button class="ghost" id="bDemo" title="Cena de exemplo">Exemplo</button>
    <div class="grow"></div>
    <div class="center">
      <button id="bCreate" class="on" title="Criar ou editar a cena com texto">✨ Diretor por prompt</button>
      <button id="bPrompt" class="ghost" title="Descrever o movimento em texto para IA de vídeo">✦ Descrever</button>
    </div>
    <div class="grow"></div>
    <select id="selRender" title="Modo de render">
      <option value="read" selected>Playblast · leitura</option>
      <option value="shaded">Playblast · cores reais</option>
      <option value="clay">Clay</option>
      <option value="depth">Depth</option>
      <option value="normal">Normal</option>
      <option value="seg">Segmentação</option>
    </select>
    <select id="selAspect" title="Proporção da câmera">
      <option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="2.39:1">2.39:1</option><option value="4:3">4:3</option>
    </select>
    <button id="bWatch" title="Assistir o filme inteiro: todos os planos em sequência, em tela cheia">▶ Assistir filme</button>
    <button id="bExport" class="pri" title="Exportar vídeo, imagem, GLB, dados">⤓ Exportar vídeo</button>
    <button class="icon" id="bShot" title="Capturar frame (PNG)">📷</button>
    <input type="file" id="fileIn" accept=".json,application/json">
  </div>
  <div id="main">
    <div id="left" class="panel">
      <div class="ph">Biblioteca <span class="grow"></span><span class="sub" id="assetCount"></span></div>
      <div id="libTabs"></div>
      <input id="libSearch" placeholder="Buscar personagens, objetos ou câmeras…">
      <div id="assets"><div id="assetList"></div></div>

let thumbR = null, thumbScene = null, thumbCam = null, thumbGround = null;
const thumbs = new Map(), thumbQ = [], thumbQueued = new Set();
function initThumbs() {
  try { thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); } catch (e) { return; }
  thumbR.setPixelRatio(1); thumbR.setSize(240, 180, false); thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.NoToneMapping;
  thumbScene = new THREE.Scene();
  const c = document.createElement('canvas'); c.width = 4; c.height = 128; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 128); g.addColorStop(0, '#36363b'); g.addColorStop(1, '#19191b'); x.fillStyle = g; x.fillRect(0, 0, 4, 128);
  const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace; thumbScene.background = bg;
  thumbScene.add(new THREE.HemisphereLight('#f3f4f7', '#57534e', 1.35));
  const dl = new THREE.DirectionalLight('#ffffff', 1.7); dl.position.set(3, 6, 4); thumbScene.add(dl);
  thumbGround = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshStandardMaterial({ color: '#2a2a2d', roughness: 1 })); thumbGround.rotation.x = -Math.PI / 2; thumbScene.add(thumbGround);
  thumbCam = new THREE.PerspectiveCamera(30, 4 / 3, 0.01, 5000);
}
function queueThumb(key, fn) { if (thumbs.has(key) || thumbQueued.has(key)) return; thumbQueued.add(key); thumbQ.push({ key, fn }); }
function snapThumb(obj, camSetup) {
  thumbScene.add(obj); obj.updateMatrixWorld(true);
  if (camSetup) camSetup(thumbCam); else {
    const bb = new THREE.Box3(); obj.traverse(n => { if (n.isMesh && !isHelperNode(n)) bb.expandByObject(n); }); if (bb.isEmpty()) bb.setFromObject(obj);
    const sph = bb.getBoundingSphere(new THREE.Sphere()), r = Math.max(0.05, sph.radius), dir = new THREE.Vector3(1.05, 0.62, 1.35).normalize();
    thumbCam.fov = 30; thumbCam.aspect = 4 / 3; thumbCam.near = r / 100; thumbCam.far = r * 100; thumbCam.updateProjectionMatrix();
    thumbCam.position.copy(sph.center).addScaledVector(dir, r / Math.sin(15 * DEG) * 0.92); thumbCam.lookAt(sph.center);
    thumbGround.scale.setScalar(r * 3); thumbGround.position.set(sph.center.x, Math.min(0, bb.min.y) - 0.001, sph.center.z);
  }
  thumbR.render(thumbScene, thumbCam);

  thumbScene.remove(obj); obj.traverse(n => { if (n.geometry) n.geometry.dispose(); });

}
function pumpThumbs() {

  const t0 = performance.now();
  while (thumbQ.length && performance.now() - t0 < 12) {
    const { key, fn } = thumbQ.shift();
    let url = null; try { url = fn(); } catch (e) { console.warn('thumb', key, e); }
    thumbs.set(key, url);
    if (url) document.querySelectorAll(`img[data-th="${key}"]`).forEach(im => { im.src = url; im.style.display = ''; if (im.nextElementSibling) im.nextElementSibling.style.display = 'none'; });
  }
}
const idleCtx = { t: 0.4, dist: 0, speed: 0, yawRate: 0, vy: 0, y: 0 };
function assetThumb(type, params) { return () => { const d = ASSETS[type], p = Object.assign(defaultParams(type), params || {}); const g = d.build(p); if (d.anim && g.userData.rig) d.anim(g.userData.rig, { ...idleCtx, y: d.pilot === 'bird' ? 2 : 0, speed: d.pilot === 'bird' ? 5 : 0 }, p); return snapThumb(g); }; }
function mannequin() { const p = Object.assign(defaultParams('person'), { look: 'mannequin', pose: 'stand' }); const g = buildPerson(p); animPerson(g.userData.rig, idleCtx, p); return { g, p }; }
function poseThumb(kind) {
  return () => {
    const A = PERSON_ACTIONS[kind]; const { g } = mannequin(); A.pose(g.userData.rig, { lt: A.dur * 0.42, u: 0.42, w: 1 });
    return snapThumb(g, cam => { cam.fov = 30; cam.aspect = 4 / 3; cam.near = .05; cam.far = 100; cam.updateProjectionMatrix(); cam.position.set(2.2, 1.6, 4.4); cam.lookAt(0, 0.85, 0); thumbGround.scale.setScalar(4); thumbGround.position.set(0, 0, 0); });
  };
}
function quadPoseThumb(kind) {
  return () => {
    const A = QUAD_ACTIONS[kind], sp = kind === 'rear' ? 'horse' : 'dog'; const p = defaultParams(sp); const g = buildQuad(p); animQuad(g.userData.rig, idleCtx); A.pose(g.userData.rig, { lt: A.dur * 0.45, u: 0.45, w: 1 });

}
function camPresetThumb(key) {
  return () => {
    const P2 = CAM_PRESETS[key], root = new THREE.Group(); const { g } = mannequin(); root.add(g);
    if (P2.ots) { const m2 = mannequin().g; m2.position.set(0, 0, 1.6); m2.rotation.y = Math.PI; root.add(m2); }
    const H = 1.75, aspect = 4 / 3, focal = P2.lens || 35, vfov = focalToVFov(focal, aspect) * DEG, [frac, cy] = SHOT_SIZES[P2.size || 'MS'];
    const d = (frac * H / 2) / Math.tan(vfov / 2), aimH = cy * H, dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(UP, (P2.yaw || 0) * DEG);

      if (P2.height === 'low') pos.y = 0.25; if (P2.height === 'high') pos.y = aimH + d * 0.6;

      if (P2.move === 'crane') pos.y += 2;

    });
  };
}
